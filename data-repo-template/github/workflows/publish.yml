# Runs after every merge to main (and by hand from the Actions tab).
#
# 1. Checks the files and does a full test build of the site with them.
# 2. Only if that passes: asks the host to rebuild (SITE_BUILD_HOOK_URL) and
#    posts "Publishing" to Teams with what changed.
# 3. If anything fails: the live site is left alone, a GitHub Issue labeled
#    build-failure is opened (or commented on, if one is already open), and
#    Teams gets an alert.
#
# Replaces the older scripts/data-repo-trigger-site-rebuild.yml template.

name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Get the merged files
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Get the previous version (for "what changed")
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}
          path: base

      - name: Get the site code
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SITE_REPO }}
          ref: main
          path: site
          # Private site repo: a read-only deploy key (preferred) or a token.
          ssh-key: ${{ secrets.SITE_REPO_DEPLOY_KEY }}
          token: ${{ secrets.SITE_REPO_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Check files
        working-directory: site
        run: |
          base_arg=""; [ -d ../base ] && base_arg="--base ../base"
          node scripts/validate-content.js --content-root ../repo $base_arg \
            --report-md ../report.md --report-json ../report.json

      - name: Test build with these files
        working-directory: site
        run: |
          rsync -a --delete ../repo/data/indicators/ data/indicators/
          rsync -a --delete ../repo/data/metadata/   data/metadata/
          rsync -a ../repo/content/ content/
          npm run build

      - name: Publish
        env:
          HOOK: ${{ secrets.SITE_BUILD_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST -d '{}' "$HOOK"; echo "Rebuild requested."
          else echo "::warning::SITE_BUILD_HOOK_URL isn't set — checks and test build passed, but nothing was published."; fi

      - name: Find the pull request
        id: pr
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0] // empty | "number=\(.number)\ntitle=\(.title)\nurl=\(.html_url)\nauthor=\(.user.login)"' >> "$GITHUB_OUTPUT" || true

      - name: Tell Teams it's publishing
        if: success()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          node site/scripts/notify-teams.js --status success \
            --title "Publishing: ${{ steps.pr.outputs.title || github.event.head_commit.message || 'update to main' }}" \
            --text "Checks and test build passed. The live site updates once the host finishes rebuilding.${{ steps.pr.outputs.author && format(' Merged from @{0}''s change.', steps.pr.outputs.author) || '' }}" \
            --url "${{ steps.pr.outputs.url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}" --url-title "What changed" \
            --report report.json

      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh label create build-failure --color b60205 --description "Publishing failed after a merge" -R "$REPO" --force >/dev/null
          {
            echo "Publishing stopped after a merge to main. **The live site was not changed.**"
            echo
            echo "- Run log: $RUN_URL"
            [ -n "$PR_URL" ] && echo "- Change that triggered it: $PR_URL"
            echo "- Commit: ${{ github.sha }}"
            echo
            [ -f report.md ] && cat report.md || echo "The file checks passed — the site build itself failed. See the run log."
          } > issue.md
          open=$(gh issue list -R "$REPO" --label build-failure --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" -R "$REPO" --body-file issue.md
          else gh issue create -R "$REPO" --title "Publishing failed: ${{ steps.pr.outputs.title || github.sha }}" --label build-failure --body-file issue.md; fi

      - name: Alert Teams
        if: failure()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          node site/scripts/notify-teams.js --status failure \
            --title "Publishing failed: ${{ steps.pr.outputs.title || 'update to main' }}" \
            --text "The live site was not changed. A GitHub issue has been opened with details." \
            --url "${{ github.server_url }}/${{ github.repository }}/issues?q=is%3Aopen+label%3Abuild-failure" --url-title "Open issue" \
            --url2 "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --url2-title "Run log" \
            --report report.json
